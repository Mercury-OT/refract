name: ci

on:
  push:
  pull_request:

jobs:
  neutrality:
    name: product-neutrality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run neutrality gate
        run: bash scripts/check_neutrality.sh

  test:
    name: tests (offline core)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the offline core litmus test
        run: pytest tests/test_opensource_litmus.py -q
