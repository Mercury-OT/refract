name: ci

on:
  push:
  pull_request:

jobs:
  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run repository hygiene checks
        run: bash scripts/check_repository_hygiene.sh

  # Bare install: proves the offline core suite runs with ONLY the `dev` extra — i.e.
  # that the demo-adapter tests are correctly collection-gated and the core needs no
  # product, browser, or network dependency. This job is what guards the
  # "product-agnostic core" claim. Running only the litmus file would prove the import
  # direction but not that the core is actually testable in isolation.
  core-only:
    name: offline core (dev extra only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core with dev extras only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the product-agnostic core litmus
        run: python scripts/run_tests.py --output-dir "$RUNNER_TEMP/test-guard-litmus" --suite-timeout 120 -- tests/test_opensource_litmus.py -q
      - name: Run the offline core suite (demo tests must skip, not error)
        run: python scripts/run_tests.py --output-dir "$RUNNER_TEMP/test-guard-core" --suite-timeout 600 -- -q
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-guard-core-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-guard-*
          if-no-files-found: warn
          retention-days: 7

  # Full suite: core plus the demo adapter across all four projections, which needs the
  # `demo` extra and a real browser. Without this job the frozen scenarios in
  # `scenarios/` and the four-projection Definition-of-Done test are never executed.
  full-suite:
    name: full suite (core + demo, four projections)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core with dev and demo extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,demo]"
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run the full test suite
        run: python scripts/run_tests.py --output-dir "$RUNNER_TEMP/test-guard-full" -- -q
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-guard-full-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-guard-full
          if-no-files-found: warn
          retention-days: 7
