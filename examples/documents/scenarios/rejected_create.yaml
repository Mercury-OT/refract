schema_version: 1
scenario: documents.rejected_create
grid:
  level: regression
  module: documents
users: [editor]
description: Observe the declared business rejection details for a disallowed category.
steps:
- id: rejected_create
  do:
    request:
      method: POST
      path:
      - documents
      body:
        title: blocked-note
        category: restricted
  expect:
    response:
    - check: failure
    - check: field_equals
      field: error_code
      value: category_not_allowed
