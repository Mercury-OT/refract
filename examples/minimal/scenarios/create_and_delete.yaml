schema_version: 1
scenario: minimal.create_and_delete
grid:
  level: smoke
  module: minimal
actor: reader
description: Create a generic record and then delete it through an empty 204 response.
parameters:
  item_name: sample-item
steps:
- id: create
  do:
    request:
      method: POST
      path:
      - records
      body:
        name: sample-item
  expect:
    response:
    - check: success
    - check: has
      field: id
    - check: field_equals
      field: name
      value:
        from_parameter: item_name
- id: delete
  do:
    request:
      method: DELETE
      path:
      - records
      - from_step: create
        response_field: id
  expect:
    response:
    - check: success
