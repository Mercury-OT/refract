# Run against an isolated target where record_code is initially unused.
# The create response acknowledges success without returning an ID.
schema_version: 1
scenario: records.create_locate_update_read
description: Locate the unique created record in an observed list, update it, and read it back
users: [creator]
parameters:
  record_code: record-example-001
  original_name: Original record
  updated_name: Updated record
steps:
  - id: create
    on_failure: stop
    do:
      request:
        method: POST
        path: [records]
        body:
          code: {from_parameter: record_code}
          name: {from_parameter: original_name}
    expect:
      response:
        - {check: status_equals, value: 201}
        - {check: success}
  - id: locate
    on_failure: stop
    do:
      request:
        method: GET
        path: [records]
        query:
          code: {from_parameter: record_code}
    expect:
      response:
        - {check: status_equals, value: 200}
        - {check: success}
        # Check the actual returned page, not a presumed server-side filter.
        - check: collection_matching_count
          field: records
          matching:
            code: {from_parameter: record_code}
          count: 1
  - id: update
    on_failure: stop
    do:
      request:
        method: PATCH
        path:
          - records
          # Exactly one observed member must match; never use its list position.
          - from_step: locate
            response_field: records
            matching:
              code: {from_parameter: record_code}
            member_field: id
        body:
          name: {from_parameter: updated_name}
    expect:
      response:
        - {check: status_equals, value: 200}
        - {check: success}
        - check: field_equals
          field: id
          value:
            from_step: locate
            response_field: records
            matching:
              code: {from_parameter: record_code}
            member_field: id
        - {check: field_equals, field: code, value: {from_parameter: record_code}}
        - {check: field_equals, field: name, value: {from_parameter: updated_name}}
  - id: read
    do:
      request:
        method: GET
        path: [records, {from_step: update, response_field: id}]
    expect:
      response:
        - {check: status_equals, value: 200}
        - {check: success}
        - {check: field_equals, field: id, value: {from_step: update, response_field: id}}
        - {check: field_equals, field: code, value: {from_parameter: record_code}}
        - {check: field_equals, field: name, value: {from_parameter: updated_name}}
