<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Record attachment archive</title></head>
<body><main>
  <h1>Record attachment archive</h1>
  <div id="record-editor">
    <label>Caption <input id="record-caption"></label>
    <label>Archive file <input id="record-blob" type="file"></label>
    <button id="record-attach" type="button">Attach to archive</button>
  </div>
  <section id="record-results"><h2>Saved attachments</h2><ol id="record-attachments"></ol></section>
  <output id="record-status">Ready</output>
</main><script src="/records.js"></script></body>
</html>
