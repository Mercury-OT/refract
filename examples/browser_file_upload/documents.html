<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Document uploads</title></head>
<body><main>
  <h1>Document uploads</h1>
  <form id="document-form">
    <label>Title <input id="document-title" name="title"></label>
    <label>Attachment <input id="document-file" name="attachment" type="file"></label>
    <button id="document-upload" type="button">Upload document</button>
  </form>
  <section id="document-results"><h2>Uploaded documents</h2><ul id="document-uploads"></ul></section>
  <output id="document-status">Ready</output>
</main><script src="/documents.js"></script></body>
</html>
