schema_version: 1
scenario: documents.flow_create
description: Create a document and publish its observed identity.
users: [operator]
steps:
  - id: submit
    do:
      request:
        method: POST
        path: [documents]
        body:
          title: {from_flow: title}
          category: guide
          content: {from_flow: content}
    expect:
      response:
        - {check: status_equals, value: 201}
        - {check: has, field: document_id}
        - {check: field_equals, field: title, value: {from_flow: title}}
        - {check: field_equals, field: content, value: {from_flow: content}}
write_flow:
  document_id: {from_step: submit, response_field: document_id}
