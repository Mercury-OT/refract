schema_version: 1
scenario: demo.item_create
grid:
  level: smoke
  module: demo
users: [user]
description: The user creates an item, the list renders it, and the backend emits
  a semantic span for the row count.
parameters:
  rows: 3
  item_name: ui-target
steps:
- id: open_page
  do: open
  target: items.page
- id: open_form
  do: click
  target: items.new_button
- id: enter_name
  do: fill
  target: items.name_input
  value:
    from_parameter: item_name
- id: main
  do: click
  target: items.submit_button
  expect:
    response:
    - check: success
    - check: has
      field: itemId
    backend_state:
    - check: span_exists
      span: item.create
    - check: span_attr
      span: item.create
      attr: row_count
      op: ==
      value: 3
    request:
      method: POST
      path:
      - items
      body:
        name:
          from_parameter: item_name
        rows:
        - 1
        - 2
        - 3
- id: inspect_created
  do: wait
  duration: 0
  expect:
    ui:
    - check: visible
      anchor: item_row
    - check: count_gt
      anchor: item_row
      count: 0
    - check: object_field_equals
      anchor: item_row
      id:
        from_step: main
        response_field: itemKey
      field: name
      value:
        from_parameter: item_name
    - check: object_field_equals
      anchor: item_row
      id:
        from_step: main
        response_field: itemKey
      field: count
      value:
        from_parameter: rows
    - check: no_anonymous
      anchor: item_row
