scenario: demo.item_list_after_create
grid: {level: smoke, module: demo}
actor: user
precondition: []
inputs: [{rows: 3}, {item_id: ui-target}]
intent: After the user creates an item, the frontend list renders it in a frontend-only scenario.
expect:
  frontend:
    - {check: visible, anchor: item_row}
    - {check: count_gt, anchor: item_row, n: 0}
    - {check: object_field_equals, anchor: item_row, id: {from_input: item_id}, field: name, value: {from_input: item_id}}
    - {check: no_anonymous, anchor: item_row}
  request:
    - {check: request, method: POST, path: items}
