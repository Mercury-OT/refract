schema_version: 1
scenario: demo.item_frontend_stepwise
users: [user]
description: Two explicit creations with a previous response value as the second name.
parameters:
  first_name: first
steps:
  - id: open_page
    do: open
    target: items.page
  - id: open_form
    do: click
    target: items.new_button
  - id: fill_first
    do: fill
    target: items.name_input
    value: {from_parameter: first_name}
  - id: create_first
    do: click
    target: items.submit_button
    expect:
      request:
        method: POST
        path: [items]
        body: {name: {from_parameter: first_name}}
      response:
        - check: success
        - check: has
          field: itemKey
      ui:
        - check: objects_matching_count
          anchor: items.rows
          field: name
          value: {from_parameter: first_name}
          count: 1
  - id: fill_second
    do: fill
    target: items.name_input
    value: {from_step: create_first, response_field: itemKey}
  - id: create_second
    do: click
    target: items.submit_button
    expect:
      request:
        method: POST
        path: [items]
        body: {name: {from_step: create_first, response_field: itemKey}}
      response:
        - check: success
      ui:
        - check: objects_matching_count
          anchor: items.rows
          field: name
          value: {from_step: create_first, response_field: itemKey}
          count: 1
