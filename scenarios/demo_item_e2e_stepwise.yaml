schema_version: 1
scenario: demo.item_e2e_stepwise
actor: user
description: Two real creations, explicit UI primitives, and independent trace checks.
parameters:
  first_name: first
steps:
  - id: open_page
    do: open
    target: items.page
  - id: open_form
    do: click
    target: items.new_button
  - id: fill_first
    do: fill
    target: items.name_input
    value: {from_parameter: first_name}
  - id: create_first
    do: click
    target: items.submit_button
    expect:
      request:
        method: POST
        path: [items]
        body: {name: {from_parameter: first_name}, rows: [1, 2, 3]}
      response:
        - check: success
        - check: has
          field: itemKey
      ui:
        - check: objects_matching_count
          anchor: items.rows
          field: name
          value: {from_parameter: first_name}
          count: 1
      backend_state:
        - check: span_exists
          span: item.create
        - check: span_attr
          span: item.create
          attr: row_count
          op: ==
          value: 3
  - id: fill_second
    do: fill
    target: items.name_input
    value: {from_step: create_first, response_field: itemKey}
  - id: create_second
    do: click
    target: items.submit_button
    expect:
      request:
        method: POST
        path: [items]
        body: {name: {from_step: create_first, response_field: itemKey}, rows: [1, 2, 3]}
      response:
        - check: success
      ui:
        - check: objects_matching_count
          anchor: items.rows
          field: name
          value: {from_step: create_first, response_field: itemKey}
          count: 1
      backend_state:
        - check: span_exists
          span: item.create
        - check: span_attr
          span: item.create
          attr: row_count
          op: ==
          value: 3
