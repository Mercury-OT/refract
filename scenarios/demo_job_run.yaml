version: 2
scenario: demo.job_run
grid: {level: regression, module: demo}
actor: user
inputs:
  - {rows: 3}
intent: Submit a job carrying the declared number of rows, wait for completion, fetch the result, and archive it; the backend must account for that exact row count both when the job is created and when its result is read.
steps:
  - id: create_job
    request:
      method: POST
      path: jobs
    expect:
      response:
        - {check: success}
        - {check: has, field: jobId}
      backend_state:
        - {check: span_exists, span: job.create}
        - {check: span_attr, span: job.create, attr: row_count, op: "==", value: 3}
  - id: wait_done
    request:
      method: GET
      path: jobs/{jobId}/status
    bind:
      jobId:
        from: create_job
        field: jobId
    poll:
      on_timeout: FAIL
    expect:
      response:
        - {check: has, field: result}
  - id: fetch_result
    request:
      method: GET
      path: jobs/{jobId}/result
    bind:
      jobId:
        from: create_job
        field: jobId
    expect:
      response:
        - {check: success}
        - {check: has, field: result}
      backend_state:
        - {check: span_exists, span: job.result.read}
        - {check: span_attr, span: job.result.read, attr: row_count, op: "==", value: 3}
  - id: archive_job
    request:
      method: POST
      path: archives
      body:
        job: "{jobId}"
        note: archived
    bind:
      jobId:
        from: create_job
        field: jobId
    expect:
      response:
        - {check: success}
