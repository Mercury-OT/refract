schema_version: 1
scenario: demo.item_update
grid:
  level: regression
  module: demo
actor: user
description: The user renames an existing item and the backend emits the item.update
  semantic span with row-count evidence.
parameters:
  new_name: renamed
steps:
- id: create
  do:
    request:
      method: POST
      path: [items]
      body: {name: update-target, rows: [1]}
  expect:
    response:
    - {check: success}
    - {check: has, field: itemId}
- id: main
  do:
    request:
      method: PUT
      path:
      - items
      - {from_step: create, response_field: itemId}
      body: {name: {from_parameter: new_name}}
  expect:
    response:
    - check: success
    - check: has
      field: itemId
    backend_state:
    - check: span_exists
      span: item.update
    - check: span_attr
      span: item.update
      attr: row_count
      op: '>'
      value: 0
