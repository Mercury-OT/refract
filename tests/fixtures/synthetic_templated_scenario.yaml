schema_version: 1
scenario: refracto.synthetic_templated_probe
grid:
  level: smoke
  module: generic
users: [actor1]
description: 'actor1 performs an abstract action that returns a task id, then polls
  the task status by id through a templated second-step path.

  '
parameters:
  payload: testdata/synthetic_input.txt
steps:
- id: create
  do:
    request:
      method: POST
      path:
      - resource
      - action
  expect:
    response:
    - check: success
    - check: has
      field: taskId
- id: get_status
  do:
    request:
      method: GET
      path:
      - resource
      - from_step: create
        response_field: taskId
      - status
  expect:
    response:
    - check: success
