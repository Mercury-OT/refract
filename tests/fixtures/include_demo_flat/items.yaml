# Independently authored flat control: not generated by the include loader.
schema_version: 1
scenario: demo.include_items_flat_control
actor: user
parameters:
  first_name: included-first
  updated_name: included-updated
steps:
  - id: first_create
    do:
      request:
        method: POST
        path: [items]
        body:
          name: {from_parameter: first_name}
          rows: [1, 2, 3]
    expect:
      response:
        - {check: success}
        - {check: has, field: itemId}
        - {check: has, field: itemKey}
        - check: field_equals
          field: name
          value: {from_parameter: first_name}
      backend_state:
        - {check: span_exists, span: item.create}
        - {check: span_attr, span: item.create, attr: row_count, op: '==', value: 3}
  - id: second_create
    do:
      request:
        method: POST
        path: [items]
        body:
          name: {from_step: first_create, response_field: itemKey}
          rows: [1, 2, 3]
    expect:
      response:
        - {check: success}
        - {check: has, field: itemId}
        - {check: has, field: itemKey}
        - check: field_equals
          field: name
          value: {from_step: first_create, response_field: itemKey}
      backend_state:
        - {check: span_exists, span: item.create}
        - {check: span_attr, span: item.create, attr: row_count, op: '==', value: 3}
  - id: update
    do:
      request:
        method: PUT
        path: [items, {from_step: second_create, response_field: itemId}]
        body:
          name: {from_parameter: updated_name}
    expect:
      response:
        - {check: success}
        - check: field_equals
          field: itemId
          value: {from_step: second_create, response_field: itemId}
      backend_state:
        - {check: span_exists, span: item.update}
  - id: read
    do:
      request: {method: GET, path: [items]}
    expect:
      response:
        - {check: success}
        - check: collection_matching_count
          field: items
          matching:
            id: {from_step: first_create, response_field: itemId}
            name: {from_parameter: first_name}
          count: 1
        - check: collection_matching_count
          field: items
          matching:
            id: {from_step: second_create, response_field: itemId}
            name: {from_parameter: updated_name}
          count: 1
