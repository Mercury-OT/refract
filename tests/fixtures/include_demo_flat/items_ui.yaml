# Independently authored flat control: not generated by the include loader.
schema_version: 1
scenario: demo.include_items_ui_flat_control
users: [user]
parameters:
  first_name: included-first
steps:
  - id: first_open_page
    do: open
    target: items.page
  - id: first_open_form
    do: click
    target: items.new_button
  - id: first_fill_name
    do: fill
    target: items.name_input
    value: {from_parameter: first_name}
  - id: first_create
    do: click
    target: items.submit_button
    expect:
      request:
        method: POST
        path: [items]
        body:
          name: {from_parameter: first_name}
          rows: [1, 2, 3]
      response:
        - {check: success}
        - {check: has, field: itemKey}
        - check: field_equals
          field: name
          value: {from_parameter: first_name}
      ui:
        - check: objects_matching_count
          anchor: items.rows
          field: name
          value: {from_parameter: first_name}
          count: 1
  - id: second_open_page
    do: open
    target: items.page
  - id: second_open_form
    do: click
    target: items.new_button
  - id: second_fill_name
    do: fill
    target: items.name_input
    value: {from_step: first_create, response_field: itemKey}
  - id: second_create
    do: click
    target: items.submit_button
    expect:
      request:
        method: POST
        path: [items]
        body:
          name: {from_step: first_create, response_field: itemKey}
          rows: [1, 2, 3]
      response:
        - {check: success}
        - {check: has, field: itemKey}
        - check: field_equals
          field: name
          value: {from_step: first_create, response_field: itemKey}
      ui:
        - check: objects_matching_count
          anchor: items.rows
          field: name
          value: {from_step: first_create, response_field: itemKey}
          count: 1
