schema_version: 1
scenario: refracto.synthetic_probe
grid:
  level: smoke
  module: generic
actor: actor1
description: 'actor1 performs an abstract action; the response carries a task id,
  a result row becomes visible, and two backend spans confirm the operation completed.

  '
parameters:
  payload: testdata/synthetic_input.txt
steps:
- id: main
  do: click
  target: resource.submit
  expect:
    response:
    - check: success
    - check: has
      field: taskId
    backend_state:
    - check: span_exists
      span: POST /resource/action
    - check: span_exists
      span: INSERT resource.job_queue
    ui:
    - check: visible
      anchor: result_row
    - check: count_gt
      anchor: result_row
      count: 0
    request:
      method: POST
      path:
      - resource
      - action
